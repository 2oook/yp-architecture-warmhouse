openapi: 3.0.3
info:
  title: Identity Service API
  version: 1.0.0
  description: Регистрация, вход, учётные записи пользователей, выдача и проверка токенов.
servers:
  - url: http://localhost:8000/api/v1
    description: API Gateway (Kong)
tags:
  - name: Auth
  - name: Users
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              register:
                summary: Регистрация нового пользователя
                value:
                  email: ivan@example.com
                  password: 'your-password'
                  name: Test User
                  phone: '+7XXXXXXXXXX'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                created:
                  summary: Созданный пользователь
                  value:
                    id: 6f1c2a3e-8b4d-4c1a-9e2f-1a2b3c4d5e6f
                    email: ivan@example.com
                    name: Test User
                    phone: '+7XXXXXXXXXX'
                    created_at: '2026-10-25T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Пользователь с таким email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                conflict:
                  summary: Email занят
                  value:
                    error: user with this email already exists
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [Auth]
      summary: Вход, получение токена
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                summary: Вход по email и паролю
                value:
                  email: ivan@example.com
                  password: 'your-password'
      responses:
        '200':
          description: Токен выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                token:
                  summary: Выданный токен
                  value:
                    access_token: jwt-access-token
                    token_type: Bearer
                    expires_in: 3600
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/validate:
    get:
      tags: [Auth]
      summary: Проверка токена (используется API Gateway)
      responses:
        '200':
          description: Токен действителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenInfo'
              examples:
                valid:
                  summary: Токен действителен
                  value:
                    user_id: 6f1c2a3e-8b4d-4c1a-9e2f-1a2b3c4d5e6f
                    expires_at: '2026-10-25T11:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me:
    get:
      tags: [Users]
      summary: Данные текущего пользователя
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                user:
                  summary: Текущий пользователь
                  value:
                    id: 6f1c2a3e-8b4d-4c1a-9e2f-1a2b3c4d5e6f
                    email: ivan@example.com
                    name: Test User
                    phone: '+7XXXXXXXXXX'
                    created_at: '2026-10-25T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Users]
      summary: Изменение данных текущего пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            examples:
              update:
                summary: Смена телефона
                value:
                  name: Test User
                  phone: '+7YYYYYYYYYY'
      responses:
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                updated:
                  summary: Обновлённый пользователь
                  value:
                    id: 6f1c2a3e-8b4d-4c1a-9e2f-1a2b3c4d5e6f
                    email: ivan@example.com
                    name: Test User
                    phone: '+7YYYYYYYYYY'
                    created_at: '2026-10-25T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badRequest:
              summary: Не заполнено обязательное поле
              value:
                error: 'field "email" is required'
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Неверные учётные данные или токен
              value:
                error: invalid credentials or token
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internalError:
              summary: Внутренняя ошибка
              value:
                error: internal server error
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        name:
          type: string
        phone:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          description: Время жизни токена в секундах
    TokenInfo:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        created_at:
          type: string
          format: date-time
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
